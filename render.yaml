services:
  - type: web
    name: delta-cloud-scanner-v3
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DELTA_BASE_URL
        value: https://api.india.delta.exchange
      - key: DELTA_WS_URL
        value: wss://socket.india.delta.exchange
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCAN_INTERVAL_SECONDS
        value: "60"
      - key: SCAN_BATCH_SIZE
        value: "5"
